 quasark_multi_aura_no_trigger:0 "We cannot have multiple Quasarcraft Auras at the same time."
 sm_quasark_aura_gravsnare_mount:0 "Gravitic Flux Field"
 sm_quasark_aura_gravsnare_mount_desc:0 "Utilizing the immense gravity around the Hyperquasar, we can project and manipulate a field of spacetime around the quasarcraft, desynchronising hostile chronology and also trapping them to assure their untimely demise."
 sm_quasark_aura_eye_mount:0 "Eye of Hawking"
 sm_quasark_aura_eye_mount_desc:0 "With the great precision of our Quasarcraft's Stringreader, we can further utilize the data by relaying them to our additional forces, allowing them to have greatly increased efficiency in firepower."
 sm_quasark_aura_gravspeed_mount:0 "Slipstream Field"
 sm_quasark_aura_gravspeed_mount_desc:0 "The Slipstream Field smoothens the journeys of friendly interlopers, giving them incredible speed across the system and streamlining hyperspace travel."
 sm_quasark_aura_deathfield_mount:0 "Quasaric Presence"
 sm_quasark_aura_deathfield_mount_desc:0 "The aspects of the Quasarcraft's immense size can quite simply be used to crush less resilient vessels with emitted ambient energy and manipulated gravity."
 sm_quasark_hyperforge_mount:0 "Teraforge Segment"
 sm_quasark_hyperforge_mount_desc:0 "A modified design of the Hyperquasaric Teraforge which can function within the confines of the Quasarcraft's segmented structure."
 sm_quasark_mini_shipyard_mount:0 "Terastructural Assembly Segment"
 sm_quasark_mini_shipyard_mount_desc:0 ""
 sm_quasark_habitation_mount:0 "Birch Habitation Segment"
 sm_quasark_habitation_mount_desc:0 "A segment following philosophies of Birch World design, with hundreds of self-sustaining 'layers' extending through the structure, allowing much more living space than the core superstructure provides."
 sm_quasark_matrioshka_mount:0 "Matrioshka Computational Segment"
 sm_quasark_matrioshka_mount_desc:0 "This segment is a technological marvel, capable of generating immensely complex problems to solve, then solving them, trillions of times per second. With even one of these segments, our technological development shall be unstoppable - before long, the Quasarcraft may well enforce our will over other galaxies."
 sm_quasark_hraemc_penrose_mount:0 "Singularitic Generation Segment"
 sm_quasark_hraemc_penrose_mount_desc:0 "Arrays of active singularities light-years long, each covered with a modified HRAE-MC linked directly to the Quasarcraft's energy supply, supporting the central Hyperquasar."
 sm_quasark_decompressor_mount:0 "Singularitic Decompression Segment"
 sm_quasark_decompressor_mount_desc:0 "Arrays of inactive singularities light-years long, with gargantuan Matter Decompressors gleaning minerals from each."
 sm_quasark_maginot_mount:0 "Maginot Defensive Segment"
 sm_quasark_maginot_mount_desc:0 "A modified Birch segment taking more inspiration from Maginot doctrines. Fortified to the bone, with weapons ranging from Devastation spire arrays to Hypercannon batteries, these segments ensure that the Quasarcraft will never fall."
 sm_quasark_speculorefractor_mount:0 "Nebula Segment"
 sm_quasark_speculorefractor_mount_desc:0 "A paradise inside and out, this segment generates interstellar nebulae in the several lightyears surrounding the Quasarcraft and shrouds it in a flurry of dust and crystal. The internals are no less impressive, putting galactic resort worlds to shame."
 quasark_song_of_end:0 "Song of the End"
 quasark_endsinger_ship_button:0 "Unleash an intensified pulse of the Quasar's gravitic energies unto this system, §Rcollapsing§! all significant matter into black holes, and §Rdestroying§! all foreign ships and starbases in the system."
 quasark_endsinger_progress_activity_key:0 "Singing the End"
 quasark_endsinger_required_progress_key:0 "£time£ 10"
 TOAST_ENDSINGER_COMPLETE_TITLE:0 "Endsinger Fired"
 TOAST_ENDSINGER_COMPLETE_DESC:0 "The Endsinger has completed its firing process."
 quasark_harvest:0 "Quasaric Harvest"
 quasark_harvest_ship_button:0 "By utilizing the passive gravity of the Hyperquasar, celestial bodies in this system can be drawn in and systematically dismantled, netting us §YBulk Matter§! and §YStellar Plasma§! from all celestial bodies and leaving the system §Rdevoid of matter§!."
 quasark_harvest_progress_activity_key:0 "Harvesting"
 quasark_harvest_required_progress_key:0 "£time£ 180"
 TOAST_HARVEST_COMPLETE_TITLE:0 "Quasaric Harvesting Complete"
 TOAST_HARVEST_COMPLETE_DESC:0 "The Quasarcraft has completed its harvesting of all major celestial bodies."
