 origin_quasark:0 "Gargantuan Quasarcraft"
 origin_quasark_effects:0 "This civilization prayed to Overlord Tempest and was gifted with a Gargantuan Quasarcraft gracing their sky. Unfortunately, said Quasarcraft shot their homeworld to rubble with a single blast, but a quickly-launched shuttle managed to infiltrate, disable, and subsequently capture the Quasarcraft before being destroyed, owing to the Quasarcraft's 99.9999% nonfunctional weapons systems and quantities of plot armor that would make a Mary Sue blush.\n\nAfter hundreds of years of 'intense population growth', the civilization is now ready to take to the stars and pulverize whatever is in their way.\n\n§RThis origin is made for testing purposes, yes I am aware it is unbalanced, respectfully what did you expect you start with a Quasarcraft.§!\n\nQuasarcraft quasarcraft quasarcraft blah blah how many times can I say quasarcraft in one paragraph simulator"
