 sm_lunark_particle_launcher_mount:0 "Lunar Particle Macrobatteries"
 sm_lunark_particle_launcher_mount_desc:0 "Arrays of particle accelerators emerging from kilometers deep within the crust, firing supercharged beams at any ship which dares venture near."
 sm_lunark_kinetic_battery_mount:0 "Lunar Synchronized Mass Accelerators"
 sm_lunark_kinetic_battery_mount_desc:0 "Large kinetic artillery cannons built in arrays on the lunar surface, enough to tear holes through larger ships in a single volley."
 sm_lunark_strike_craft_mount:0 "Lunar Macro-Hangar Bays"
 sm_lunark_strike_craft_mount_desc:0 "Hangars embedded in the structural segments of the moon's frontal superstructure, releasing hordes of Strike Destroyers to tear apart vessels small and large alike."
 sm_planark_particle_launcher_mount:0 "Planetary Particle Macrobatteries"
 sm_planark_particle_launcher_mount_desc:0 "Arrays of particle accelerators emerging from kilometers deep within the crust, firing supercharged beams at any ship which dares venture near."
 sm_planark_kinetic_battery_mount:0 "Planetary Synchronized Mass Accelerators"
 sm_planark_kinetic_battery_mount_desc:0 "Large kinetic artillery cannons built amongst support frames and building rooftops across the Planetcraft, enough to tear holes through larger ships in a single volley."
 sm_planark_strike_craft_mount:0 "Planetary Macro-Hangar Bays"
 sm_planark_strike_craft_mount_desc:0 "Hangars built throughout the supporting framework over the planetary surface, releasing hordes of Strike Destroyers to tear apart vessels small and large alike."
 sm_sysark_particle_launcher_mount:0 "Stellar Particle Macrobatteries"
 sm_sysark_particle_launcher_mount_desc:0 "Arrays of particle accelerators emerging from kilometers deep within the crusts of the Systemcraft's constituent celestials, firing supercharged beams at any ship which dares venture near."
 sm_sysark_kinetic_battery_mount:0 "Stellar Synchronized Mass Accelerators"
 sm_sysark_kinetic_battery_mount_desc:0 "Large kinetic artillery cannons built in arrays on the forefront weaponry of the Stellar Systemcraft, enough to tear holes through larger ships in a single volley."
 sm_sysark_strike_craft_mount:0 "Stellar Macro-Hangar Bays"
 sm_sysark_strike_craft_mount_desc:0 "Hangars distributed across all the celestial bodies of the Stellar Systemcraft, releasing hordes of Strike Destroyers to tear apart vessels small and large alike."
 sm_sysark_o_particle_launcher_mount:0 "Stellar Particle Macrobatteries"
 sm_sysark_o_particle_launcher_mount_desc:0 "Arrays of particle accelerators emerging from kilometers deep within the crusts of the Systemcraft's constituent celestials, firing supercharged beams at any ship which dares venture near."
 sm_sysark_o_kinetic_battery_mount:0 "Stellar Synchronized Mass Accelerators"
 sm_sysark_o_kinetic_battery_mount_desc:0 "Large kinetic artillery cannons built in arrays on the forefront weaponry of the Stellar Systemcraft, enough to tear holes through larger ships in a single volley."
 sm_sysark_o_strike_craft_mount:0 "Stellar Macro-Hangar Bays"
 sm_sysark_o_strike_craft_mount_desc:0 "Hangars distributed across all the celestial bodies of the Stellar Systemcraft, releasing hordes of Strike Destroyers to tear apart vessels small and large alike."
