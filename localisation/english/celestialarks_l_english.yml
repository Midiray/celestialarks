 GIGA_PLANET_MISSILE_2_DESC:0 "Massive missile batteries built on the planet's surface, capable of immense devastation."
 CARKS_ARTILLERY_MACRO:0 "Celestial Synchronized Mass Accelerators"
 CARKS_ARTILLERY_MACRO_DESC:0 "Large kinetic artillery cannons built in arrays on the celestial surface, enough to tear holes through larger ships in a single volley."
 CARKS_LAUNCHER_MACRO:0 "Celestial Particle Macrobatteries"
 CARKS_LAUNCHER_MACRO_DESC:0 "Arrays of particle accelerators emerging from kilometers deep within the crust, firing supercharged beams at any ship which dares venture near."
 CARKS_HANGAR_MACRO:0 "Celestial Strike Destroyer Swarm"
 CARKS_HANGAR_MACRO_DESC:0 "Hangars the size of cities built in the polar regions of the celestial, releasing hordes of Strike Destroyers to tear apart vessels small and large alike."
