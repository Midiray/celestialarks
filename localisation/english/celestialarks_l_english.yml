l_english:
 sm_quasark_endsinger_1_mount:0 "§MThe Endsinger§!"
 sm_quasark_endsinger_1_mount_desc:0 "Our scientists have designed a weapon capable of storing ten days' worth of the full gravitational force of the Hyperquasar, then releasing it in one earthshattering pulse. Literally."
 sm_quasark_endsinger_2_mount:0 "Quasarcraft's Eye"
 sm_quasark_endsinger_2_mount_desc:0 "The relativistic jets emitted by the Quasar can be redirected and focused into beams of such utter annihilation, the Existential Pseudo-Erasure Beam looks like a water gun in comparison."
 sm_quasark_endsinger_3_mount:0 "Quasi-Stellar Obliterator"
 sm_quasark_endsinger_3_mount_desc:0 "These beams, though not quite as destructive as the design termed the Quasarcraft's Eye, still retain enough power to erase a Stellar Systemcraft from this plane of existence in a single shot, and much more of them can be fit within the power confines of the Quasarcraft."
 sm_quasark_shipyard_mount:0 "Celestial Assembly Yards"
 sm_quasark_shipyard_mount_desc:0 "More weaponry on a ship of this scale is, as some would put it, overkill. Therefore, we can instead use the majority of the Quasarcraft's output to power shipyards of such unimaginable magnitude, they would be able to assemble Stellar Systemcrafts from scratch."
 sm_quasark_titanic_1_mount:0 "Devastation Arrays"
 sm_quasark_titanic_1_mount_desc:0 "Rows upon rows of Devastator Cannons stretching for hundreds of millions of kilometres across several of the outermost rings."
 sm_quasark_additional_eye_mount:0 "HRFACE"
 sm_quasark_additional_eye_mount_desc:0 "Hawking-Radiative Focused Anti-Celestial Emitters, or HRFACEs, built on the peripheries of the Hyperquasar support the main relativistic beams, allowing more Quasarcraft's Eyes to be supported by the Quasarcraft."
