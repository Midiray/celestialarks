 sm_quasark_shipyard_tt:0 "Celestial Warships, including the §RStellar Systemcraft§!, can be assembled from the Quasarcraft."
 pc_quasark:0 "Gargantuan Quasarcraft"
 pc_quasark_desc:0 "An incomprehensibly large construct over 250AU in diameter, the Quasarcraft is the pinnacle of all realms of science within this galaxy. Containing thousands of districts, each of which can measure up to modern gigastructures for production, it is the future of our nation. With weapon systems that, in some cases, measure their projectile weight in solar masses, it serves as an impossibly powerful and nigh-invincible flagship, defying physics with its mere existence."
 pc_sysark_o:0 "Class O Stellar Systemcraft"
 pc_sysark_o_desc:0 "When the Stellar Systemcraft was designed, it came to light that the weapon designs we had planned could not come to their fullest fruition with a regular G-type star. Therefore, with the compression of a Class O star as the core of this Systemcraft, it can power an entire armada's worth of weaponry by itself."
 pc_sysark:0 "Stellar Systemcraft"
 pc_sysark_desc:0 "The Stellar Systemcraft, once considered the ramblings of a madman, now serves as a flagship within our navy. Though it may look impractical, higher-dimensional engineering hides all but the most necessary components from sight, meaning its 'true' footprint is much larger than what is seen."
 pc_planark:0 "Behemoth Planetcraft"
 pc_planark_desc:0 "A step up from the Attack Moon, the Behemoth Planetcraft employs much the same technologies, but on a far larger scale. Able to win a fight against any Moon with little difficulty, it is a much more refined and permanent mainstay of the fleet."
 pc_lunark:0 "Attack Moon"
 pc_lunark_desc:0 "A warship dwarfing even the largest of conventional vessels, the Attack Moon flies proud as our first true step into Celestial doctrine. Equipped as a mobile artillery flagship, with sufficient escort the Attack Moon will make our dominance amongst the stars felt."
 SHIP_AURA_SYSTEM:0 "Stellar Presence"
 SHIP_AURA_SYSTEM_DESC:0 "By employing advanced gravitational manipulation technologies across higher-dimensional space, the Stellar Systemcraft is able to \"project\" its gravity well in the direction of a specified target, massively impacting its mobility."
 SHIP_AURA_MOON:0 "Lunar Presence"
 SHIP_AURA_MOON_DESC:0 "By employing advanced gravitational manipulation technologies across higher-dimensional space, the Attack Moon is able to \"project\" its gravity well in the direction of a specified target, massively impacting its mobility."
 GIGA_MOON_MISSILE_2:0 "Lunar Missile Batteries"
 GIGA_MOON_MISSILE_2_DESC:0 "Massive missile batteries built on the moon's surface, capable of immense devastation."
