 sm_quasark_hangar_mount:0 "Grand Celestial Hangars"
 sm_quasark_hangar_mount_desc:0 "Impossibly large hangars across the various edges of the Quasarcraft, holding swarms of Attack Moons and Behemoth Planetcraft fabricated to screen and protect the Quasarcraft from all threats."
 sm_sysark_planet_missile_mount:0 "Auxiliary Planetary Missile Batteries"
 sm_sysark_planet_missile_mount_desc:0 "Space on the rearmost celestials making up the Stellar Systemcraft reserved for mass indirect fire missile arrays."
 sm_sysark_o_planet_missile_mount:0 "Auxiliary Planetary Missile Batteries"
 sm_sysark_o_planet_missile_mount_desc:0 "Space on the rearmost celestials making up the Stellar Systemcraft reserved for mass indirect fire missile arrays. The increased power output from the Class O star allows more missiles to be supported without overloading."
 sm_lunark_moon_missile_mount:0 "Auxiliary Lunar Missile Batteries"
 sm_lunark_moon_missile_mount_desc:0 "Reserving more space for our Lunar Missile Batteries allows us to launch an ever-larger number of missiles into the void."
 sm_planark_planet_missile_mount:0 "Auxiliary Planetary Missile Batteries"
 sm_planark_planet_missile_mount_desc:0 "City-sized blocks of space near the main weapons array of the Planetcraft, reserved for increased missile loads."
