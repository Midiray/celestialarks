 zone_quasark_heavy_focus:0 "Heavy Weapon Focus"
 zone_quasark_heavy_focus_desc:0 "Extensive defense installations taking inspiration from our most modern Maginot World designs, focused on the production and maintenance of the Quasarcraft's heavy weapons."
 zone_quasark_super_heavy_focus:0 "Super-Heavy Weapon Focus"
 zone_quasark_super_heavy_focus_desc:0 "Extensive defense installations taking inspiration from our most modern Maginot World designs, focused on the upgrading and maintenance of the Quasarcraft's main super-heavy weapon array."
 zone_quasark_light_focus:0 "Light Weapon Focus"
 zone_quasark_light_focus_desc:0 "Extensive defense installations taking inspiration from our most modern Maginot World designs, focused on the production and maintenance of the Quasarcraft's light weapons."
 zone_quasark_hangar_focus:0 "Strike Craft Focus"
 zone_quasark_hangar_focus_desc:0 "Extensive defense installations taking inspiration from our most modern Maginot World designs, focused on the production and maintenance of the Quasarcraft's celestial strike craft."
 zone_quasark_energy_generation_focus:0 "Energy Generation & Support"
 zone_quasark_energy_generation_focus_desc:0 "Utilize the energies of the Hyperquasar to support the craft's onboard resource generation efforts."
 zone_quasark_energy_speed_focus:0 "Event Horizon Overclocking"
 zone_quasark_energy_speed_focus_desc:0 "By redirecting the passive radiation around the Quasar directly to the Event Horizon Drive, we can speed up the Quasarcraft both in sublight and FTL speed, and lower the cooldown for long-range jumps."
 zone_quasark_energy_damage_focus:0 "Energetic Hypercharging"
 zone_quasark_energy_damage_focus_desc:0 "Using the Quasar's energetic radiation directly in the output shots of our energy weaponry will drastically increase their damage output."
