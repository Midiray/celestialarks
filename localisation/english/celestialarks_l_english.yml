 sm_lunark_devastator_cannon_mount:0 "Lunar Devastator Batteries"
 sm_lunark_devastator_cannon_mount_desc:0 "Taking inspiration from Nomadic Devastator Cannons, we can implement a similar design as a secondary weapon for our Attack Moon - though without shutting off the power."
 sm_planark_devastator_cannon_mount:0 "Planetary Devastator Batteries"
 sm_planark_devastator_cannon_mount_desc:0 "Our experiments into Devastator technology with the Attack Moon were a roaring success. Scaling up the technology for use on the Behemoth Planetcraft is the logical next step."
 sm_sysark_devastator_cannon_mount:0 "Stellar Devastator Batteries"
 sm_sysark_devastator_cannon_mount_desc:0 "Combining the firing positions of the frontal weapons array of the Stellar Systemcraft allows us to fit an unreasonable number of Devastator Cannons, giving enough volume of fire to be a substantial secondary weapon to the main weapons array."
 sm_sysark_o_devastator_cannon_mount:0 "Stellar Devastator Batteries"
 sm_sysark_o_devastator_cannon_mount_desc:0 "The power gained from using a Class O star in our Stellar Systemcraft allows us to fit even more Devastator Cannons where we previously would have overloaded the power grid."
 requires_kaiser_moon_defeat:0 "Requires you to defeat and reverse-engineer the technology behind the §YKaiser Moon§!."
 requires_stellar_kaiser_moon_defeat:0 "Requires you to defeat and reverse-engineer the technology behind the §RStellarite Kaiser Moon§!."
 lunark_kaiser_moon_sections_unlock:0 "Equipping this spinal mount will grant you access to improved modules for the Attack Moon's weaponry."
